<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>飞机大战</title>
<style>
  body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { background: #001122; }
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const keys = {};
onkeydown = e => keys[e.key] = true;
onkeyup = e => keys[e.key] = false;

const player = { x: 185, y: 520, w: 30, h: 30, cd: 0 };
let bullets = [], enemies = [], score = 0, frame = 0, over = false;

// 画一架 30x30 的小飞机,down=true 时机头朝下(敌机)
function drawPlane(x, y, color, down) {
  ctx.save();
  ctx.translate(x + 15, y + 15);
  if (down) ctx.rotate(Math.PI);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -15);            // 机头
  ctx.lineTo(4, -2);
  ctx.lineTo(15, 8);             // 右翼尖
  ctx.lineTo(15, 12);
  ctx.lineTo(4, 8);
  ctx.lineTo(3, 15);             // 右尾翼
  ctx.lineTo(-3, 15);            // 左尾翼
  ctx.lineTo(-4, 8);
  ctx.lineTo(-15, 12);           // 左翼尖
  ctx.lineTo(-15, 8);
  ctx.lineTo(-4, -2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function loop() {
  if (over) {
    ctx.fillStyle = '#fff'; ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('游戏结束 得分: ' + score, 200, 280);
    ctx.font = '16px sans-serif';
    ctx.fillText('按回车重新开始', 200, 320);
    if (keys['Enter']) { bullets = []; enemies = []; score = 0; over = false; }
    requestAnimationFrame(loop); return;
  }
  frame++;

  // 玩家移动
  if (keys['ArrowLeft']  || keys['a']) player.x -= 5;
  if (keys['ArrowRight'] || keys['d']) player.x += 5;
  if (keys['ArrowUp']    || keys['w']) player.y -= 5;
  if (keys['ArrowDown']  || keys['s']) player.y += 5;
  player.x = Math.max(0, Math.min(370, player.x));
  player.y = Math.max(0, Math.min(570, player.y));

  // 射击
  if (keys[' '] && player.cd <= 0) {
    bullets.push({ x: player.x + 11, y: player.y, w: 8, h: 20 });
    player.cd = 10;
  }
  player.cd--;

  // 生成敌机
  if (frame % 40 === 0)
    enemies.push({ x: Math.random() * 370, y: -30, w: 30, h: 30, v: 2 + Math.random() * 2 });

  // 移动与碰撞
  bullets.forEach(b => b.y -= 8);
  enemies.forEach(e => e.y += e.v);
  bullets = bullets.filter(b => b.y > -20);
  enemies = enemies.filter(e => {
    if (e.y > 600) return false;
    const bi = bullets.findIndex(b => hit(b, e));
    if (bi >= 0) { bullets.splice(bi, 1); score += 10; return false; }
    if (hit(player, e)) over = true;
    return true;
  });

  // 绘制
  ctx.clearRect(0, 0, 400, 600);
  drawPlane(player.x, player.y, '#4f4', false);
  ctx.fillStyle = '#ff0';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  enemies.forEach(e => drawPlane(e.x, e.y, '#f44', true));
  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('得分: ' + score, 10, 25);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
